<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Retrieval Comparison Platform{% endblock %}</title>
<style>
:root{--ink:#1d2433;--muted:#5d667a;--line:#dde1ea;--bg:#f6f7fa;--card:#fff;--accent:#1f4e8c;--accent2:#e8eef8;--ok:#1e7a46;--warn:#9a5b00}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--accent);color:#fff;padding:12px 24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
header b{font-size:16px}header a{color:#dbe6f7;text-decoration:none}header a:hover{color:#fff}
main{max-width:1280px;margin:0 auto;padding:24px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:24px 0 8px}.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g2,.g4{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;background:#fafbfd}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:12px}
.btn{display:inline-block;padding:8px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;text-decoration:none;cursor:pointer;font:inherit}
.btn.ghost{background:#fff;color:var(--accent)}.btn:hover{filter:brightness(1.1)}
select,input{font:inherit;padding:6px}
.abstract{white-space:pre-wrap;font-size:14px;line-height:1.6}
ol.rank{padding-left:22px;margin:0}ol.rank li{margin-bottom:8px;font-size:13.5px}
ol.rank .score{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
details summary{cursor:pointer}.note{background:#fff8e6;border:1px solid #f0d9a6;color:#6b4a00;padding:8px 12px;border-radius:6px}
.scores{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.scores form{flex:1;min-width:220px}
.scores button{width:100%;text-align:left;padding:12px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;font:inherit}
.scores button:hover{border-color:var(--accent)}.scores button.sel{border-color:var(--ok);background:#eef8f1}
.scores small{display:block;color:var(--muted);margin-top:4px}
</style></head><body>
<header><b>Lexical · Semantic · Hybrid Retrieval Comparison</b>
<a href="{{ url_for('home') }}">Overview</a><a href="{{ url_for('search') }}">Retrieval demo</a>
<a href="{{ url_for('annotate', phase='dev') }}">Judge dev pool</a><a href="{{ url_for('annotate', phase='final') }}">Judge final pool</a>
<a href="{{ url_for('resolve', phase='final') }}">Resolve</a><a href="{{ url_for('results') }}">Results</a></header>
<main>{% block body %}{% endblock %}</main></body></html>
